<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Language Wearable V1</title><style>body{font-family:system-ui;background:#111;color:#fff;margin:0;padding:20px}.app{max-width:650px;margin:auto}.gold{color:#d4af37}button,select,textarea{font-size:18px;border-radius:12px;padding:14px;margin:6px 0;width:100%;box-sizing:border-box}button{background:#d4af37;color:#111;border:0;font-weight:700}button.secondary{background:#292929;color:#fff;border:1px solid #d4af37}.row{display:grid;grid-template-columns:1fr 60px 1fr;gap:8px;align-items:center}.card{background:#1d1d1d;padding:16px;border-radius:16px;margin-top:14px}textarea{background:#0d0d0d;color:#fff;border:1px solid #555;min-height:100px}.status{text-align:center;padding:10px}</style></head><body><div class="app"><h1 class="gold">Language Wearable V1</h1><p>Prototipo voce → testo → traduzione → voce</p><div class="row"><select id="from"><option value="it-IT">Italiano</option><option value="fr-FR">Français</option><option value="en-US">English</option></select><button class="secondary" id="swap">⇄</button><select id="to"><option value="fr-FR">Français</option><option value="it-IT">Italiano</option><option value="en-US">English</option></select></div><button id="listen">🎙️ PARLA</button><div class="status" id="status">Pronto</div><div class="card"><b>Testo riconosciuto</b><textarea id="source" placeholder="Parla oppure scrivi qui..."></textarea><button id="translate">TRADUCI</button></div><div class="card"><b>Traduzione</b><textarea id="translated" readonly></textarea><button id="speak">🔊 ASCOLTA</button></div><p style="font-size:13px;color:#aaa">V1 sperimentale. La traduzione usa un servizio online pubblico; non inserire dati sensibili.</p></div><script>
const $=id=>document.getElementById(id), names={'it-IT':'it','fr-FR':'fr','en-US':'en'};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
$('listen').onclick=()=>{if(!SR){$('status').textContent='Riconoscimento vocale non supportato in questo browser';return;} const r=new SR();r.lang=$('from').value;r.interimResults=false;r.maxAlternatives=1;$('status').textContent='Ascolto…';r.onresult=e=>{$('source').value=e.results[0][0].transcript;$('status').textContent='Voce riconosciuta';translate();};r.onerror=e=>$('status').textContent='Errore microfono: '+e.error;r.onend=()=>{if($('status').textContent==='Ascolto…')$('status').textContent='Pronto';};r.start();};
async function translate(){let q=$('source').value.trim();if(!q)return;$('status').textContent='Traduzione…';try{let pair=names[$('from').value]+'|'+names[$('to').value];let u='https://api.mymemory.translated.net/get?q='+encodeURIComponent(q)+'&langpair='+encodeURIComponent(pair);let res=await fetch(u);let data=await res.json();$('translated').value=data.responseData?.translatedText||'Errore traduzione';$('status').textContent='Traduzione pronta';speak();}catch(e){$('status').textContent='Errore di rete/traduzione';}}
function speak(){let t=$('translated').value.trim();if(!t)return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang=$('to').value;speechSynthesis.speak(u);}
$('translate').onclick=translate;$('speak').onclick=speak;$('swap').onclick=()=>{let a=$('from').value;$('from').value=$('to').value;$('to').value=a;[$('source').value,$('translated').value]=[$('translated').value,$('source').value];};
</script></body></html>
